<section class="register-page" aria-labelledby="register-title">
  <div class="register-card">
    <h1 id="register-title">Créer un compte</h1>

    <form class="register-form">
      <!-- Collect the account email and password details. -->
      <div class="register-fields">
        <div class="form-group">
          <label for="register-email">Email</label>
          <input
            id="register-email"
            name="email"
            type="email"
            placeholder="Saisissez votre email..."
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <input
            id="register-password"
            name="password"
            type="password"
            placeholder="Saisissez votre mot de passe..."
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-password-confirmation">Vérification du mot de passe</label>
          <input
            id="register-password-confirmation"
            name="passwordConfirmation"
            type="password"
            placeholder="Saisissez-le à nouveau"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <!-- Keep the login link and submit action grouped below the fields. -->
      <div class="register-actions">
        <a class="login-link" routerLink="/login">J'ai déjà un compte</a>
        <button class="register-button" type="button">Créer mon compte</button>
      </div>
    </form>
  </div>
</section>
